schema_version: 1
coordinate_system: GCJ-02
routes_dir: memory_nav/routes

trajectory:
  resample_spacing_m: 5.0
  smoothing_window: 5
  max_speed_m_s: 4.0
  duplicate_distance_m: 0.05

vio:
  topic: /odometry
  maximum_alignment_rms_m: 5.0
  online_minimum_pairs: 3

quality:
  minimum_gps_samples: 5
  minimum_route_length_m: 3.0
  maximum_gps_gap_s: 5.0
  maximum_rejection_ratio: 0.5

matching: {}

deviation:
  warning_m: 3.0
  severe_m: 5.0
  phone_scale: 2.0
  enter_samples: 3
  recover_samples: 3

anchors:
  # max_spacing_m kept large so only start/turn/end anchors are produced;
  # distance-based "interval" anchors are disabled.
  max_spacing_m: 1000.0
  turn_angle_deg: 35.0
  advance_distance_m: 8.0
  arrival_distance_m: 2.0
  blur_threshold: 100.0
  auto_confirm: true

voice:
  cooldown_s: 10.0

segmentation:
  # Map the tracked clock direction onto a bottom-center semicircle and
  # compare it with a CAT-Seg walkable mask.  Masks are precomputed with
  # memory_nav/scripts/precompute_walkable_masks.sh (catseg conda env).
  # A forward hour is feasible when the nearest non-walkable pixel in its
  # sector lies beyond radius_ratio*H (clear), allowing a tiny noise tolerance.
  enabled: false
  mask_dir: null
  origin_x_ratio: 0.5
  origin_y_ratio: 1.0
  radius_ratio: 0.25
  inner_radius_ratio: 0.05
  half_width_deg: 15.0
  max_obstacle_ratio: 0.005
  command_tolerance_hours: 1
  forward_hours: [9, 10, 11, 12, 1, 2, 3]
  # Optional voice texts (used by the online guard).
  messages:
    no_walkable: "前方未检测到可通行区域，请停止前进"
    no_walkable_rotate: "无可行区域，请旋转一下"
  catseg_project_dir: /home/wheeltec/projects/blind-nav-server/CAT-Seg
  catseg_config: configs/vitb_384.yaml
  catseg_weights: model_base.pth
  catseg_device: cuda
  # Online mode (memory_nav/scripts/follow_reference_trajectory_seg.sh): a
  # persistent CAT-Seg worker in the catseg conda env is started automatically
  # and queried over a Unix socket. Inference is throttled and the navigation
  # loop only uses recent masks paired with their exact source frame.
  online:
    worker_python: /home/wheeltec/anaconda3/envs/catseg_seg/bin/python
    socket_path: null
    # TensorRT FP16 avoids the PyTorch/NvMap allocator failure on Jetson r36.4.7.
    backend: tensorrt
    device: cuda
    trt_clip_engine: /home/wheeltec/projects/blind-nav-server/CAT-Seg/export/catseg_stages/catseg_clip_stage_fp16.engine
    trt_aggregator_engine: /home/wheeltec/projects/blind-nav-server/CAT-Seg/export/catseg_stages/catseg_aggregator_stage_fp16.engine
    trt_python_path: /usr/lib/python3.10/dist-packages
    trt_warmup: 1
    input_scale: 0.5
    min_size_test: 384
    max_hz: 4.0
    # Reject masks more than 800 ms after the frame reached the host.
    max_mask_age_s: 0.8
    walkable_names: pavement,road,stairs,floor-marble,floor-stone,floor-tile,floor-wood
    vis_dir: memory_nav/analysis/test_0917/seg_online
    vis_interval_s: 0.25
    # Optional online-only judgment radius override; null keeps radius_ratio.
    radius_ratio: null
